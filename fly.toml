# Fly.io deployment configuration for OneClick AI Backend

app = "oneclick-ai-backend"
primary_region = "sjc"

[build]
  # Fly will use the Dockerfile in the root directory

[env]
  RUST_LOG = "info"
  HOST = "0.0.0.0"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
